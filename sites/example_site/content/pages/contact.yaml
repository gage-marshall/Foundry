page:
  slug: "contact"
  title: "Contact Us"
  meta_description: "Get in touch with us"

sections:
  - type: "hero"
    content: "sections/hero-contact.md"
    config:
      height: "40vh"
      text_align: "center"

  - type: "contact"
    content: "sections/contact-intro.md"
    config:
      fields:
        - name: "name"
          type: "text"
          label: "Name"
          required: true
          placeholder: "John Doe"
        - name: "email"
          type: "email"
          label: "Email"
          required: true
          placeholder: "john@example.com"
        - name: "subject"
          type: "text"
          label: "Subject"
          required: false
          placeholder: "How can we help?"
        - name: "message"
          type: "textarea"
          label: "Message"
          required: true
          placeholder: "Your message here..."
      submit_text: "Send Message"
      success_message: "Thank you for your message! We'll get back to you soon."
      error_message: "Oops! Something went wrong. Please try again."
      recaptcha: false

  - type: "footer"
    config:
      copyright: "&copy; 2025 Example Site. Powered by Foundry Engine."
