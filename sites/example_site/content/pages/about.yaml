page:
  slug: "about"
  title: "About Foundry"
  meta_description: "Learn about Foundry Engine - a modern static site generator built with FastAPI"

sections:
  - type: "hero"
    content: "sections/hero-about.md"
    config:
      background_image: "https://images.unsplash.com/photo-1517694712202-14dd9538aa97?w=1920&q=80"
      height: "60vh"
      overlay_opacity: 0.7
      text_align: "center"
      parallax: true

  - type: "text"
    content: "sections/about-content.md"
    config:
      max_width: "900px"
      text_align: "left"
      padding: "4rem 2rem"

  - type: "features"
    content: "sections/tech-stack.md"
    config:
      columns: 4
      icon_style: "outlined"
      card_style: "flat"
      features:
        - title: "FastAPI"
          description: "Modern async Python framework"
          icon: "🚀"
        - title: "Pydantic"
          description: "Type-safe configuration"
          icon: "✓"
        - title: "Jinja2"
          description: "Powerful templating"
          icon: "📄"
        - title: "Alpine.js"
          description: "Lightweight reactivity"
          icon: "⚡"
        - title: "HTMX"
          description: "Dynamic interactions"
          icon: "🔄"
        - title: "AOS"
          description: "Scroll animations"
          icon: "✨"
        - title: "Markdown"
          description: "Simple content authoring"
          icon: "📝"
        - title: "Python"
          description: "Reliable foundation"
          icon: "🐍"

  - type: "testimonials"
    content: "sections/testimonials.md"
    config:
      layout: "grid"
      testimonials:
        - quote: "Foundry Engine gave us perfect Lighthouse scores out of the box. The performance optimizations are incredible!"
          author: "Sarah Chen"
          role: "Lead Developer"
          company: "TechCorp"
        - quote: "Security built-in from day one. JWT auth, CSRF protection, rate limiting - everything we needed without extra work."
          author: "Marcus Rodriguez"
          role: "Security Engineer"
          company: "SecureApps"
        - quote: "The separation of content, structure, and styling is brilliant. We update the engine without touching our 20+ sites."
          author: "Emily Watson"
          role: "Engineering Manager"
          company: "Digital Agency"

  - type: "cta"
    content: "sections/cta-about.md"
    config:
      background_color: "#4f46e5"
      text_color: "#ffffff"
      button:
        text: "Get In Touch"
        url: "/contact"
        style: "outline"

  - type: "footer"
    config:
      copyright: "&copy; 2025 Example Site. Powered by Foundry Engine."
