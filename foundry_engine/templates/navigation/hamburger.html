<div class="nav-hamburger" x-data="{ menuOpen: false }">
    <div class="nav-header">
        {% if logo %}
            <a href="/">
                <img src="{{ logo }}" alt="{{ logo_alt }}" class="nav-logo">
            </a>
        {% else %}
            <a href="/" class="nav-logo-text">{{ logo_alt }}</a>
        {% endif %}

        <button @click="menuOpen = !menuOpen" class="hamburger-button" aria-label="Toggle menu">
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
        </button>
    </div>

    <div x-show="menuOpen"
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 transform scale-95"
         x-transition:enter-end="opacity-100 transform scale-100"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100 transform scale-100"
         x-transition:leave-end="opacity-0 transform scale-95"
         @click.away="menuOpen = false"
         class="hamburger-menu">
        <ul class="nav-items">
            {% for item in items %}
                <li class="nav-item{% if item.is_active %} nav-active{% endif %}">
                    <a href="{{ item.url }}" class="nav-link">
                        {% if item.icon %}<span class="nav-icon">{{ item.icon }}</span>{% endif %}
                        {{ item.text }}
                    </a>
                </li>
            {% endfor %}
        </ul>
    </div>
</div>
