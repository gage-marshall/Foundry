<section class="section-contact">
    <div class="contact-container">
        {% if content %}
            <div class="contact-intro"
                 data-aos="fade-up">
                {{ content|safe }}
            </div>
        {% endif %}

        <form class="contact-form"
              hx-post="/api/contact"
              hx-trigger="submit"
              hx-target="#contact-message"
              hx-swap="innerHTML"
              x-data="{ submitting: false, focusedField: null }"
              @htmx:before-request="submitting = true"
              @htmx:after-request="submitting = false"
              data-aos="fade-up"
              data-aos-delay="200">

            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

            <!-- Message Display -->
            <div id="contact-message"
                 role="alert"
                 x-transition:enter="transition ease-out duration-300"
                 x-transition:enter-start="opacity-0 transform -translate-y-2"
                 x-transition:enter-end="opacity-100 transform translate-y-0"></div>

            <!-- Form Fields -->
            <div class="form-fields">
                {% for field in fields %}
                    <div class="form-group"
                         x-data="{ focused: false, filled: false }"
                         :class="{ 'form-group-focused': focused, 'form-group-filled': filled }"
                         data-aos="fade-up"
                         data-aos-delay="{{ 300 + (loop.index0 * 100) }}">

                        <label for="{{ field.name }}" class="form-label">
                            {{ field.label or field.name|title }}
                            {% if field.required %}<span class="required" aria-label="required">*</span>{% endif %}
                        </label>

                        {% if field.type == 'textarea' %}
                            <textarea
                                id="{{ field.name }}"
                                name="{{ field.name }}"
                                class="form-control"
                                {% if field.placeholder %}placeholder="{{ field.placeholder }}"{% endif %}
                                {% if field.required %}required aria-required="true"{% endif %}
                                rows="5"
                                @focus="focused = true"
                                @blur="focused = false; filled = $el.value.length > 0"
                                @input="filled = $el.value.length > 0"></textarea>
                        {% elif field.type == 'select' %}
                            <div class="select-wrapper">
                                <select
                                    id="{{ field.name }}"
                                    name="{{ field.name }}"
                                    class="form-control form-select"
                                    {% if field.required %}required aria-required="true"{% endif %}
                                    @focus="focused = true"
                                    @blur="focused = false; filled = $el.value.length > 0"
                                    @change="filled = $el.value.length > 0">
                                    <option value="">Select...</option>
                                    {% for option in field.options %}
                                        <option value="{{ option }}">{{ option }}</option>
                                    {% endfor %}
                                </select>
                                <svg class="select-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="6 9 12 15 18 9"></polyline>
                                </svg>
                            </div>
                        {% else %}
                            <input
                                type="{{ field.type }}"
                                id="{{ field.name }}"
                                name="{{ field.name }}"
                                class="form-control"
                                {% if field.placeholder %}placeholder="{{ field.placeholder }}"{% endif %}
                                {% if field.required %}required aria-required="true"{% endif %}
                                @focus="focused = true"
                                @blur="focused = false; filled = $el.value.length > 0"
                                @input="filled = $el.value.length > 0">
                        {% endif %}

                        <!-- Floating Animation Bar -->
                        <span class="form-field-bar" :class="{ 'form-field-bar-active': focused }"></span>
                    </div>
                {% endfor %}
            </div>

            {% if recaptcha %}
                <div class="form-recaptcha" data-aos="fade-up" data-aos-delay="{{ 300 + (fields|length * 100) }}">
                    <div class="g-recaptcha" data-sitekey="{{ recaptcha_site_key }}"></div>
                </div>
            {% endif %}

            <!-- Submit Button -->
            <div class="form-submit" data-aos="fade-up" data-aos-delay="{{ 400 + (fields|length * 100) }}">
                <button type="submit"
                        class="btn btn-primary btn-submit"
                        :disabled="submitting"
                        :class="{ 'btn-submitting': submitting }"
                        x-data="{ hover: false }"
                        @mouseenter="hover = true"
                        @mouseleave="hover = false">
                    <span class="btn-content" x-show="!submitting">
                        <span class="btn-text">{{ submit_text }}</span>
                        <svg class="btn-icon" :class="{ 'btn-icon-hover': hover }" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </span>
                    <span class="btn-content" x-show="submitting">
                        <svg class="btn-spinner" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                        </svg>
                        <span class="btn-text">Sending...</span>
                    </span>
                </button>
            </div>
        </form>

        <!-- Contact Info (Optional) -->
        <div class="contact-decoration" aria-hidden="true">
            <svg class="contact-decoration-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <path fill="currentColor" d="M45.3,-57.3C58.9,-48.4,70.1,-33.6,73.7,-17.2C77.3,-0.8,73.2,17.2,64.6,31.8C56,46.4,42.8,57.6,27.4,63.4C12,69.2,-5.6,69.6,-22.1,64.8C-38.6,60,-54,50,-62.8,36.1C-71.6,22.2,-73.8,4.4,-70.5,-11.8C-67.2,-28,-59.4,-42.6,-47.7,-51.9C-36,-61.2,-20.4,-65.2,-3.6,-60.8C13.2,-56.4,31.7,-66.2,45.3,-57.3Z" transform="translate(100 100)" />
            </svg>
        </div>
    </div>
</section>

{% if recaptcha %}
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
{% endif %}
