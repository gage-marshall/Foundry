<section class="section-text"
         style="padding: {{ padding }};{% if background_color %} background-color: {{ background_color }};{% endif %}">
    <div class="text-container" style="max-width: {{ max_width }}; text-align: {{ text_align }};">
        <div class="text-content" data-aos="fade-up">
            {{ content|safe }}
        </div>
    </div>

    <!-- Background Decoration -->
    <div class="text-decoration" aria-hidden="true">
        <div class="text-decoration-pattern"></div>
    </div>
</section>
